<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>健身打卡</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F6F5FA; --sur: #FFFFFF;
  --bd: rgba(100,80,180,0.10); --bdm: rgba(100,80,180,0.18);
  --t1: #1A1820; --t2: #5A5468; --t3: #A099B8;
  --p: #6C3FC5; --pm: #8B5CF6; --pl: #F0EAFB; --pll: #F8F5FF;
  --amb: #A0560A; --ambl: #FEF3E6;
  --red: #C0392B; --redl: #FDECEA;
  --grn: #237A4B; --grnl: #EAFAF2;
  --nav: 64px; --sb: env(safe-area-inset-bottom,0px);
}
html,body { height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif; color:var(--t1); font-size:15px; -webkit-font-smoothing:antialiased; }
#app { max-width:390px; margin:0 auto; height:100%; display:flex; flex-direction:column; background:var(--bg); }
.scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--nav) + var(--sb) + 20px); }
.page { display:none; } .page.active { display:block; }

/* header */
.hdr { background:var(--sur); padding:18px 20px 14px; border-bottom:.5px solid var(--bd); position:sticky; top:0; z-index:10; }
.hdr h1 { font-size:22px; font-weight:700; color:var(--p); letter-spacing:-.3px; }
.hdr .sub { font-size:13px; color:var(--t3); margin-top:2px; }

/* nav */
.nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:390px; height:calc(var(--nav) + var(--sb)); background:var(--sur); border-top:.5px solid var(--bd); display:flex; align-items:flex-start; padding-top:8px; z-index:100; }
.nb { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:4px 0; color:var(--t3); font-family:inherit; }
.nb .ni { font-size:22px; line-height:1; }
.nb .nl { font-size:11px; font-weight:500; }
.nb.on { color:var(--p); }

/* section label */
.slbl { font-size:11px; font-weight:700; color:var(--p); letter-spacing:.07em; text-transform:uppercase; margin:18px 20px 8px; }

/* card */
.card { background:var(--sur); border-radius:14px; border:.5px solid var(--bd); overflow:hidden; }

/* progress */
.prog-wrap { padding:16px 20px 8px; }
.prog-block { background:var(--pl); border:.5px solid rgba(108,63,197,.2); border-radius:12px; padding:12px 14px; }
.prog-lbl { font-size:12px; font-weight:700; color:var(--p); margin-bottom:8px; }
.prog-bg { height:9px; background:rgba(108,63,197,.12); border-radius:99px; overflow:hidden; margin-bottom:6px; }
.prog-fill { height:100%; background:var(--pm); border-radius:99px; transition:width .5s; }
.prog-fill.done { background:var(--grn); }
.prog-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--t3); }
.prog-meta strong { color:var(--p); font-size:14px; font-weight:700; }

/* stats grid */
.sgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 20px 4px; }
.scell { background:var(--sur); border:.5px solid var(--bd); border-radius:10px; padding:11px 8px; text-align:center; }
.scell .sv { font-size:18px; font-weight:700; color:var(--p); }
.scell .sl { font-size:11px; color:var(--t3); margin-top:3px; }

/* table */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { font-size:11px; font-weight:600; color:var(--t3); text-align:left; padding:8px 12px; border-bottom:.5px solid var(--bd); background:var(--pll); }
.tbl th:not(:first-child) { text-align:right; }
.tbl td { padding:9px 12px; border-bottom:.5px solid var(--bd); vertical-align:middle; }
.tbl td:not(:first-child) { text-align:right; color:var(--t2); }
.tbl tr:last-child td { border-bottom:none; }
.tbl .tn { font-weight:500; } .tbl .tc { color:var(--p); font-weight:700; }

/* month grid */
.mgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 20px 14px; }
.mcell { background:var(--sur); border:.5px solid var(--bd); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; }
.mcell .mn { font-size:13px; font-weight:500; }
.mcell .mc { font-size:13px; color:var(--p); font-weight:700; }

/* fab */
.fab { position:fixed; bottom:calc(var(--nav) + var(--sb) + 16px); right:calc(50% - 195px + 16px); width:50px; height:50px; background:var(--p); color:#fff; border:none; border-radius:50%; font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 14px rgba(108,63,197,.4); z-index:200; transition:transform .15s; }
.fab:active { transform:scale(.92); }

/* modal */
.overlay { display:none; position:fixed; inset:0; background:rgba(20,10,40,.45); z-index:300; align-items:flex-end; justify-content:center; }
.overlay.open { display:flex; }
.sheet { background:var(--sur); border-radius:20px 20px 0 0; width:100%; max-width:390px; padding:20px 20px calc(var(--sb) + 24px); max-height:85vh; overflow-y:auto; }
.mtitle { font-size:17px; font-weight:700; color:var(--p); margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; }
.mclose { background:var(--pl); border:none; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; color:var(--p); display:flex; align-items:center; justify-content:center; }
.flbl { font-size:12px; font-weight:700; color:var(--p); margin-bottom:5px; display:block; }
.fg { margin-bottom:14px; }
.fi, .fs { width:100%; padding:11px 12px; background:var(--bg); border:.5px solid var(--bdm); border-radius:10px; font-size:15px; color:var(--t1); font-family:inherit; outline:none; -webkit-appearance:none; }
.fi:focus,.fs:focus { border-color:var(--p); }
.fi.sm { padding:8px 10px; font-size:13px; }
.btnp { width:100%; padding:13px; background:var(--p); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px; font-family:inherit; }
.btnp:active { opacity:.85; }
.btng { background:none; border:.5px solid var(--bdm); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; color:var(--t2); font-family:inherit; }

/* plan tabs */
.ptabs { display:flex; gap:8px; padding:14px 16px 0; }
.ptab { flex:1; padding:8px 0; text-align:center; background:var(--sur); border:.5px solid var(--bdm); border-radius:10px; font-size:13px; font-weight:500; color:var(--t2); cursor:pointer; font-family:inherit; }
.ptab.on { background:var(--pl); color:var(--p); border-color:var(--p); font-weight:700; }

/* exercise */
.sec-ttl { font-size:11px; font-weight:700; color:var(--p); padding:7px 14px 5px; background:var(--pll); letter-spacing:.05em; text-transform:uppercase; }
.ex { padding:10px 14px; border-bottom:.5px solid var(--bd); }
.ex:last-child { border-bottom:none; }
.ex-nm { font-size:13px; font-weight:600; line-height:1.45; color:var(--t1); }
.ex-hint { font-size:11px; color:var(--t3); margin-top:3px; line-height:1.5; }
.ex-hint .ref { color:var(--p); font-weight:600; }
.ex-hint .tip { color:var(--amb); }
.ex-inp { display:flex; gap:8px; margin-top:8px; }
.ex-inp .fs { flex:1.2; font-size:13px; padding:8px 10px; }
.ex-inp .fi { flex:1; }

/* history tabs */
.htabs { display:flex; gap:8px; padding:14px 16px 0; flex-wrap:wrap; }
.htab { flex:1; min-width:60px; padding:7px 4px; text-align:center; background:var(--sur); border:.5px solid var(--bdm); border-radius:10px; font-size:12px; font-weight:500; color:var(--t2); cursor:pointer; font-family:inherit; }
.htab.on { background:var(--pl); color:var(--p); border-color:var(--p); font-weight:700; }
.htab.htab-sum { background:var(--pll); color:var(--p); font-weight:600; }
.htab.htab-sum.on { background:var(--p); color:#fff; border-color:var(--p); font-weight:700; }

/* comparison table */
.cmp-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:12px 0 0; padding-bottom:4px; }
.cmp-wrap::-webkit-scrollbar { height:3px; }
.cmp-wrap::-webkit-scrollbar-thumb { background:var(--pm); border-radius:99px; }
.cmpt { border-collapse:separate; border-spacing:0; font-size:12px; min-width:max-content; width:100%; }
.cmpt th { background:var(--pll); font-size:11px; font-weight:600; color:var(--t3); padding:8px 10px; white-space:nowrap; border-bottom:1px solid var(--bdm); text-align:center; vertical-align:bottom; }
.cmpt th.thn { position:sticky; left:0; z-index:3; text-align:left; min-width:120px; max-width:120px; background:var(--pll); border-right:1px solid var(--bdm); }
.cmpt td { padding:7px 10px; border-bottom:.5px solid var(--bd); vertical-align:top; white-space:nowrap; text-align:center; color:var(--t2); background:var(--sur); min-width:76px; }
.cmpt td.tdn { position:sticky; left:0; z-index:1; text-align:left; white-space:normal; min-width:120px; max-width:120px; background:var(--sur); border-right:1px solid var(--bdm); line-height:1.4; color:var(--t1); font-weight:500; font-size:12px; }
.cmpt tr:last-child td { border-bottom:none; }
.cmpt td.vw { color:var(--p); font-weight:700; }
.cmpt td.ve { color:var(--t3); }
.cmpt td.vr { color:var(--red); font-size:11px; }
.cmpt .sr td { background:var(--pll) !important; color:var(--p) !important; font-weight:700; font-size:11px; padding:5px 10px; border-bottom:.5px solid var(--bdm) !important; }
.cmpt .sr td.tdn { background:var(--pl) !important; }
.dh .dd { font-size:12px; font-weight:700; color:var(--t1); }
.dh .dw { font-size:10px; color:var(--t3); margin-top:1px; }

/* summary list (总计) */
.sum-row { background:var(--sur); border-top:.5px solid var(--bd); border-bottom:.5px solid var(--bd); margin-bottom:1px; padding:11px 20px; display:flex; justify-content:space-between; align-items:center; }
.sum-lbl { font-size:14px; font-weight:600; color:var(--t1); }
.sum-dates { font-size:11px; color:var(--t3); margin-top:3px; line-height:1.5; }
.sum-cnt { font-size:20px; font-weight:700; color:var(--p); }


/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px; }
.cal-nav .cal-title { font-size:16px; font-weight:700; color:var(--p); }
.cal-nav button { background:none; border:.5px solid var(--bdm); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:16px; color:var(--t2); display:flex; align-items:center; justify-content:center; font-family:inherit; }
.cal-nav button:active { background:var(--pl); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 12px 12px; }
.cal-dow { font-size:10px; font-weight:600; color:var(--t3); text-align:center; padding:4px 0 6px; }
.cal-day { position:relative; border-radius:8px; padding:4px 2px 5px; min-height:52px; text-align:center; background:var(--sur); border:.5px solid transparent; }
.cal-day.other-month { background:none; border-color:transparent; }
.cal-day.other-month .cal-dn { color:var(--t3); opacity:.4; }
.cal-day.today { border-color:var(--p); }
.cal-day.today .cal-dn { color:var(--p); font-weight:700; }
.cal-day.has-log { background:var(--pll); border-color:var(--bd); }
.cal-dn { font-size:12px; font-weight:500; color:var(--t1); line-height:1; }
.cal-tags { display:flex; flex-direction:column; gap:2px; margin-top:3px; align-items:center; }
.ctag { font-size:9px; font-weight:700; border-radius:3px; padding:1px 3px; line-height:1.3; white-space:nowrap; }
.ctag-upper { background:#EDE9FB; color:#5B21B6; }
.ctag-lower { background:#FEF3E6; color:#A0560A; }
.ctag-core   { background:#EAFAF2; color:#237A4B; }
.cal-legend { display:flex; gap:10px; flex-wrap:wrap; padding:4px 16px 12px; }
.cl-item { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--t2); }
.cl-dot { width:10px; height:10px; border-radius:2px; }
.cal-summary-row { display:flex; justify-content:space-between; padding:10px 20px; border-top:.5px solid var(--bd); }
.cal-sum-item { text-align:center; }
.cal-sum-val { font-size:18px; font-weight:700; color:var(--p); }
.cal-sum-lbl { font-size:11px; color:var(--t3); margin-top:2px; }

/* data tools */
.data-bar { display:flex; gap:8px; padding:12px 16px; background:var(--sur); border-bottom:.5px solid var(--bd); }
.btn-export { flex:1; padding:9px; background:var(--p); color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-import { flex:1; padding:9px; background:var(--pll); color:var(--p); border:.5px solid var(--bdm); border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
/* checkin calendar */
.ci-cal-wrap { margin:0 16px 16px; background:var(--sur); border-radius:14px; border:.5px solid var(--bd); overflow:hidden; }
.ci-cal-nav { display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px; }
.ci-cal-title { font-size:14px; font-weight:700; color:var(--p); }
.ci-cal-nav button { background:none; border:.5px solid var(--bdm); border-radius:7px; width:28px; height:28px; cursor:pointer; font-size:15px; color:var(--t2); display:flex; align-items:center; justify-content:center; font-family:inherit; }
.ci-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 8px 10px; }
.ci-dow { font-size:10px; font-weight:600; color:var(--t3); text-align:center; padding:2px 0 5px; }
.ci-day { border-radius:7px; padding:3px 1px 4px; min-height:44px; text-align:center; background:var(--bg); border:.5px solid transparent; }
.ci-day.om { background:none; }
.ci-day.om .ci-dn { opacity:.3; }
.ci-day.td { border-color:var(--p); }
.ci-day.td .ci-dn { color:var(--p); font-weight:700; }
.ci-day.hl { background:var(--pll); border-color:var(--bd); }
.ci-dn { font-size:11px; color:var(--t1); line-height:1; }
.ci-dots { display:flex; flex-direction:column; gap:1px; margin-top:2px; align-items:center; }
.ci-tag { font-size:8px; font-weight:700; border-radius:2px; padding:1px 2px; line-height:1.3; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }

/* edit/delete list items */
.rec-list { margin:12px 16px 0; }
.rec-item {
  background:var(--sur); border:.5px solid var(--bd); border-radius:12px;
  margin-bottom:8px; overflow:hidden;
}
.rec-item-hdr {
  display:flex; justify-content:space-between; align-items:center;
  padding:11px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.rec-item-hdr:active { background:var(--pll); }
.rec-main { font-size:14px; font-weight:600; color:var(--t1); }
.rec-sub  { font-size:11px; color:var(--t3); margin-top:2px; }
.rec-amt  { font-size:14px; font-weight:700; color:var(--amb); margin-right:8px; }
.rec-chevron { font-size:14px; color:var(--t3); transition:transform .2s; }
.rec-chevron.open { transform:rotate(180deg); }
.rec-actions {
  display:none; border-top:.5px solid var(--bd);
  padding:10px 14px; gap:8px; background:var(--pll);
}
.rec-actions.open { display:flex; }
.btn-edit {
  flex:1; padding:8px; background:var(--p); color:#fff;
  border:none; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; font-family:inherit;
}
.btn-del {
  flex:1; padding:8px; background:var(--redl); color:var(--red);
  border:.5px solid rgba(192,57,43,.2); border-radius:8px;
  font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
}
/* edit modal */
.edit-row { display:flex; gap:8px; margin-bottom:12px; }
.edit-row .fi, .edit-row .fs { flex:1; }

/* table total row */
.tbl-total td { 
  background:var(--pl); font-weight:700; 
  border-top:.5px solid var(--bdm) !important;
  border-bottom:none !important;
  color:var(--p) !important;
}
.tbl-total td.tc { color:var(--p) !important; }

/* badge */
.badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
.bp { background:var(--pl); color:var(--p); }
.bg { background:var(--grnl); color:var(--grn); }

/* empty */
.empty { text-align:center; padding:48px 24px; color:var(--t3); font-size:14px; }
.empty .ei { font-size:38px; margin-bottom:12px; opacity:.35; }
</style>
</head>
<body>
<div id="app">
<div class="scroll" id="sc">

<!-- PAGE 打卡 -->
<div class="page active" id="page-checkin">
  <div class="hdr"><h1>健身打卡</h1><div class="sub" id="today-str"></div></div>

  <!-- 年度100次目标 -->
  <!-- 数据工具栏 -->
  <div class="data-bar">
    <button class="btn-export" onclick="exportData()">📤 导出数据备份</button>
    <label class="btn-import" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">
      📥 导入数据<input type="file" accept=".json" style="display:none;" onchange="importData(event)">
    </label>
  </div>

  <div class="prog-wrap">
    <div class="prog-block">
      <div class="prog-lbl">🎯 年度100次目标</div>
      <div class="prog-bg"><div class="prog-fill" id="count-bar" style="width:0%"></div></div>
      <div class="prog-meta">
        <span><strong id="count-done">0</strong> / 100次</span>
        <span id="count-pct">0%</span>
      </div>
    </div>
  </div>

  <!-- 打卡日历 -->
  <div class="slbl">打卡日历</div>
  <div class="ci-cal-wrap" id="ci-cal-container"></div>

  <!-- 月度统计 -->
  <div class="slbl">月度统计（2026年）</div>
  <div class="mgrid" id="month-grid"></div>

  <!-- 项目统计 -->
  <div class="slbl">项目统计</div>
  <div class="card" style="margin:0 16px 16px;">
    <table class="tbl">
      <thead><tr><th>项目</th><th>次数</th><th>合计</th><th>次均</th></tr></thead>
      <tbody id="proj-tbody"></tbody>
    </table>
  </div>
</div>

<!-- PAGE 记录 -->
<div class="page" id="page-record">
  <div class="hdr"><h1>训练记录</h1><div class="sub" id="rec-date"></div></div>
  <div class="ptabs">
    <button class="ptab on" data-plan="upper" onclick="switchPlan('upper')">上肢</button>
    <button class="ptab" data-plan="lower" onclick="switchPlan('lower')">臀腿</button>
    <button class="ptab" data-plan="core" onclick="switchPlan('core')">足底+核心</button>
  </div>
  <div id="plan-container" style="margin-top:12px;"></div>
  <div style="padding:16px 16px 8px;">
    <button class="btnp" onclick="saveRec()">保存本次训练记录</button>
  </div>
</div>

<!-- PAGE 管理数据 -->
<div class="page" id="page-manage">
  <div class="hdr"><h1>管理数据</h1><div class="sub">编辑或删除记录</div></div>
  <div class="ptabs" style="padding:14px 16px 0;">
    <button class="ptab on" data-mt="checkin" onclick="switchManageTab('checkin')">打卡数据</button>
    <button class="ptab" data-mt="training" onclick="switchManageTab('training')">训练数据</button>
  </div>
  <div id="ci-edit-list" style="margin-top:4px;"></div>
  <div id="log-edit-list" style="margin-top:4px;display:none;"></div>
</div>

<!-- PAGE 历史训练 -->
<div class="page" id="page-history">
  <div class="hdr"><h1>历史训练</h1><div class="sub">横向对比视图</div></div>
  <div class="htabs">
    <button class="htab htab-sum on" data-ht="summary" onclick="switchHTab('summary')">📅 总计</button>
    <button class="htab" data-ht="upper" onclick="switchHTab('upper')">上肢</button>
    <button class="htab" data-ht="lower" onclick="switchHTab('lower')">臀腿</button>
    <button class="htab" data-ht="core" onclick="switchHTab('core')">足底+核心</button>
  </div>
  <div id="hist-container"></div>
</div>

</div><!-- scroll -->

<nav class="nav">
  <button class="nb on" id="nav-checkin" onclick="go('checkin')"><span class="ni">🏅</span><span class="nl">打卡</span></button>
  <button class="nb" id="nav-record" onclick="go('record')"><span class="ni">🏋️</span><span class="nl">记录</span></button>
  <button class="nb" id="nav-history" onclick="go('history')"><span class="ni">📊</span><span class="nl">历史</span></button>
  <button class="nb" id="nav-manage" onclick="go('manage')"><span class="ni">✏️</span><span class="nl">管理</span></button>
</nav>

<button class="fab" id="fab" onclick="openModal()">+</button>

<!-- 打卡 modal -->
<div class="overlay" id="modal">
  <div class="sheet">
    <div class="mtitle"><span>添加打卡记录</span><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="fg"><label class="flbl">打卡项目</label><select class="fs" id="ci-proj"></select></div>

// ═══ STATS ═══
function getStats() {
  // Use only user-added checkins for delta (PRESET_PROJ already includes historical data)
  const ci = getRawCheckins();
  const pm = {};
  PRESET_PROJ.forEach(p => { pm[p.name]={count:p.count,total:p.total}; });
  ci.forEach(c => {
    if (!pm[c.project]) pm[c.project]={count:0,total:0};
    pm[c.project].count++; pm[c.project].total+=(c.amount||0);
  });
  return {
    projMap: pm,
    totalAmt: PRESET_AMT + ci.reduce((s,c)=>s+(c.amount||0),0),
    totalCount: PRESET_CNT + ci.length,
  };
}

// ═══ RENDER: CHECKIN PAGE ═══
function renderCheckin() {
  const now = new Date();
  document.getElementById('today-str').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 周${WDS[now.getDay()]}`;

  const {projMap,totalAmt,totalCount} = getStats();

  // count progress
  const cp = Math.min(100, Math.round(totalCount/GOAL*100));
  document.getElementById('count-done').textContent = totalCount;
  document.getElementById('count-pct').textContent = cp+'%';
  const cb = document.getElementById('count-bar');
  cb.style.width = cp+'%';
  cb.className = 'prog-fill' + (cp>=100?' done':'');

  // month grid
  const ci = getRawCheckins(); // only user-added, avoids double-counting
  const mm = {};
  PRESET_MONTH.forEach(m => { mm[m.m]={c:m.c}; });
  ci.forEach(c => {
    const k=(new Date(c.date).getMonth()+1)+'月';
    if(!mm[k]) mm[k]={c:0};
    mm[k].c++;
  });
  const mg = document.getElementById('month-grid');
  mg.innerHTML='';
  ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach(m=>{
    if(!mm[m]) return;
    const d=document.createElement('div'); d.className='mcell';
    d.innerHTML=`<div class="mn">2026 ${m}</div><div class="mc">${mm[m].c}次</div>`;
    mg.appendChild(d);
  });

  // project table
  const tb = document.getElementById('proj-tbody'); tb.innerHTML='';
  let sumCount=0, sumTotal=0;
  Object.entries(projMap).sort((a,b)=>b[1].total-a[1].total).forEach(([name,v])=>{
    const avg = v.count>0?Math.round(v.total/v.count):0;
    sumCount += v.count; sumTotal += v.total;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="tn">${name}</td><td class="tc">${v.count}</td>
      <td style="color:var(--amb);text-align:right;">${v.total>0?v.total+'元':'—'}</td>
      <td>${avg>0?avg+'元':'—'}</td>`;
    tb.appendChild(tr);
  });
  // Total row
  const sumAvg = sumCount>0?Math.round(sumTotal/sumCount):0;
  const totalTr=document.createElement('tr');
  totalTr.className='tbl-total';
  totalTr.innerHTML=`<td>总计</td><td class="tc">${sumCount}</td>
    <td style="text-align:right;">${sumTotal>0?sumTotal+'元':'—'}</td>
    <td>${sumAvg>0?sumAvg+'元':'—'}</td>`;
  tb.appendChild(totalTr);
}

let curPlan='upper';
function lastW(eid) {
  for(const log of getLogs()){
    if(!log.results) continue;
    const r=log.results.find(x=>x.id===eid);
    if(r && r.weight && r.weight!=='/' && r.weight!=='o（完成）' && r.weight!=='') return r.weight+(r.note&&r.note!=='/'?r.note:'');
  }
  return null;
}

  plan.sections.forEach(sec=>{
    const card=document.createElement('div'); card.className='card'; card.style.cssText='margin:0 16px 10px;';
    let h=`<div class="sec-ttl">${sec.title}</div>`;
    sec.exs.forEach(ex=>{
      const lw=lastW(ex.id);
      const refStr = lw ? `<span class="ref">上次：${lw}</span>` : (ex.ref?`<span class="ref">参考：${ex.ref}</span>`:'');
      const meta = [ex.sets&&ex.rm?`${ex.sets} · ${ex.rm}`:(ex.sets||ex.rm||''), refStr].filter(Boolean).join('　');

      h+=`<div class="ex">
        <div class="ex-nm">${noLabel}${ex.name.replace(/\n/g,'<br>')}</div>

function saveRec() {
  const plan=PLANS[curPlan]; let results=[],hasInput=false;
  plan.sections.forEach(sec=>sec.exs.forEach(ex=>{
    const w=document.getElementById('ew-'+ex.id)?.value||'';

function fmtCell(w,note) {
  // Never show "o（完成）" in comparison table — show only weight values
  if(!w||w==='/'||w==='/（未进行）'||w==='o（完成）') return {txt:'—',cls:'ve'};
  const display = (note && note!=='/' && note!=='') ? w+note : w;
  return {txt:display, cls:'vw'};
}

function renderCmpTable(planKey) {
  const plan=PLANS[planKey];
  const logs=getLogs().filter(l=>l.plan===planKey).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!logs.length) return `<div class="empty"><div class="ei">📭</div><div>暂无${plan.label}训练记录</div></div>`;

  const dhs=logs.map(l=>{const d=new Date(l.date);return{date:`${d.getMonth()+1}/${d.getDate()}`,wd:`周${WDS[d.getDay()]}`};});
  const lkp=logs.map(log=>{const m={};(log.results||[]).forEach(r=>m[r.id]=r);return m;});

  // Build ordered exercise list from plan
  const exList=[];
  plan.sections.forEach(sec=>sec.exs.forEach(ex=>exList.push({...ex,sec:sec.title})));

  const dcw=Math.max(72,Math.floor(240/Math.min(logs.length,4)));
  let h=`<div class="cmp-wrap"><table class="cmpt"><thead><tr><th class="thn">动作</th>`;
  dhs.forEach(d=>h+=`<th style="min-width:${dcw}px;"><div class="dh"><div class="dd">${d.date}</div><div class="dw">${d.wd}</div></div></th>`);
  h+=`</tr></thead><tbody>`;

  let lastSec='';
  exList.forEach(ex=>{
    if(ex.sec!==lastSec){
      lastSec=ex.sec;
      h+=`<tr class="sr"><td class="tdn">${ex.sec}</td>${logs.map(()=>'<td></td>').join('')}</tr>`;
    }
    const noStr=ex.no?`<span style="color:var(--p);font-weight:700;">${ex.no}</span> `:'';
    h+=`<tr><td class="tdn">${noStr}${ex.name.replace(/\n/g,' / ')}</td>`;
    lkp.forEach(m=>{
      const r=m[ex.id];
      const {txt,cls}=fmtCell(r?.weight||'',r?.note||'');
      h+=`<td class="${cls}">${txt}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

// Calendar state
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

function renderSummary() {
  const logs=getLogs();
  // Build date map: 'YYYY-MM-DD' -> [planKey, ...]
  const dateMap={};
  logs.forEach(l=>{
    const d=new Date(l.date);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!dateMap[key]) dateMap[key]=[];
    if(!dateMap[key].includes(l.plan)) dateMap[key].push(l.plan);
  });

  const tagLabel={upper:'上肢',lower:'臀腿',core:'足底+核心'};
  const tagCls={upper:'ctag-upper',lower:'ctag-lower',core:'ctag-core'};

  const today=new Date();
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const startDow=firstDay.getDay(); // 0=Sun
  const daysInMonth=lastDay.getDate();

  // Counts for this month
  const mKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const mLogs=logs.filter(l=>l.date.startsWith(mKey));
  const cnt={upper:0,lower:0,core:0};
  mLogs.forEach(l=>{ if(cnt[l.plan]!==undefined) cnt[l.plan]++; });

  let h=`<div>`;

  // Nav
  const mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  h+=`<div class="cal-nav">
    <button onclick="calPrev()">‹</button>
    <span class="cal-title">${calYear}年 ${mNames[calMonth]}</span>
    <button onclick="calNext()">›</button>
  </div>`;

  // Legend
  h+=`<div class="cal-legend">
    <div class="cl-item"><div class="cl-dot" style="background:#EDE9FB;border:.5px solid #C4B5FD;"></div>上肢</div>
    <div class="cl-item"><div class="cl-dot" style="background:#FEF3E6;border:.5px solid #FBD38D;"></div>臀腿</div>
    <div class="cl-item"><div class="cl-dot" style="background:#EAFAF2;border:.5px solid #9AE6B4;"></div>足底+核心</div>
  </div>`;

  // DOW headers
  h+=`<div class="cal-grid">`;
  ['日','一','二','三','四','五','六'].forEach(d=>{ h+=`<div class="cal-dow">${d}</div>`; });

  // Leading empty cells
  for(let i=0;i<startDow;i++) h+=`<div class="cal-day other-month"></div>`;

  // Day cells
  for(let d=1;d<=daysInMonth;d++){
    const key=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const plans=dateMap[key]||[];
    const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const cls=['cal-day', plans.length?'has-log':'', isToday?'today':''].filter(Boolean).join(' ');
    let tags='';
    // Order: upper, lower, core
    ['upper','lower','core'].forEach(pk=>{
      if(plans.includes(pk)) tags+=`<div class="ctag ${tagCls[pk]}">${tagLabel[pk]}</div>`;
    });
    h+=`<div class="${cls}"><div class="cal-dn">${d}</div><div class="cal-tags">${tags}</div></div>`;
  }

  // Trailing empty cells
  const trailing=(7-((startDow+daysInMonth)%7))%7;
  for(let i=0;i<trailing;i++) h+=`<div class="cal-day other-month"></div>`;
  h+=`</div>`; // cal-grid

  // Monthly + cumulative summary counts
  const allCnt={upper:0,lower:0,core:0};
  logs.forEach(l=>{ if(allCnt[l.plan]!==undefined) allCnt[l.plan]++; });
  h+=`<div class="cal-summary-row">
    <div class="cal-sum-item"><div class="cal-sum-val">${cnt.upper}</div><div class="cal-sum-lbl">上肢/月</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val">${cnt.lower}</div><div class="cal-sum-lbl">臀腿/月</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val">${cnt.core}</div><div class="cal-sum-lbl">足底/月</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val" style="color:var(--t2);">${mLogs.length}</div><div class="cal-sum-lbl">本月合计</div></div>
  </div>
  <div class="cal-summary-row" style="background:var(--pll);">
    <div class="cal-sum-item"><div class="cal-sum-val" style="font-size:15px;">${allCnt.upper}</div><div class="cal-sum-lbl">上肢累计</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val" style="font-size:15px;">${allCnt.lower}</div><div class="cal-sum-lbl">臀腿累计</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val" style="font-size:15px;">${allCnt.core}</div><div class="cal-sum-lbl">足底累计</div></div>
    <div class="cal-sum-item"><div class="cal-sum-val" style="font-size:15px;color:var(--p);">${logs.length}</div><div class="cal-sum-lbl">累计合计</div></div>
  </div>`;

  h+=`</div>`;
  return h;
}

function exportData() {

    training_logs: JSON.parse(localStorage.getItem('training_logs')||'[]'),
    custom_projs: JSON.parse(localStorage.getItem('custom_projs')||'[]'),

function importData(evt) {
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.checkins)      SS('checkins', data.checkins);
      if(data.training_logs) SS('training_logs', data.training_logs);
      if(data.custom_projs)  SS('custom_projs', data.custom_projs);
      alert('✅ 数据导入成功！共导入打卡 '+data.checkins.length+' 条，训练记录 '+data.training_logs.length+' 条');
      renderCheckin();
      renderCiCal();
    } catch(err) {
      alert('❌ 导入失败，请确认是正确的备份文件');
    }
  };
  reader.readAsText(file);
}

let ciCalYear=new Date().getFullYear(), ciCalMonth=new Date().getMonth();

// Generate a stable color for any project name
function projColor(name) {
  const palette = [
    {bg:'#EDE9FB',fg:'#5B21B6'},{bg:'#FEF3E6',fg:'#A0560A'},
    {bg:'#EAFAF2',fg:'#237A4B'},{bg:'#FEE2E2',fg:'#991B1B'},
    {bg:'#E0F2FE',fg:'#0369A1'},{bg:'#FCE7F3',fg:'#9D174D'},
    {bg:'#FEF9C3',fg:'#854D0E'},{bg:'#F0FDF4',fg:'#166534'},
    {bg:'#F5F3FF',fg:'#6D28D9'},{bg:'#FFF7ED',fg:'#C2410C'},
  ];
  let hash=0; for(let i=0;i<name.length;i++) hash=(hash*31+name.charCodeAt(i))&0xffff;
  return palette[hash % palette.length];
}

function renderCiCal() {
  const container = document.getElementById('ci-cal-container');
  if(!container) return;

  const ci = getCheckins();
  // Build date map: 'YYYY-MM-DD' -> [projectName, ...]
  const dateMap = {};
  ci.forEach(c => {
    const d = new Date(c.date);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!dateMap[key]) dateMap[key]=[];
    if(!dateMap[key].includes(c.project)) dateMap[key].push(c.project);
  });

  const today = new Date();
  const firstDay = new Date(ciCalYear, ciCalMonth, 1);
  const daysInMonth = new Date(ciCalYear, ciCalMonth+1, 0).getDate();
  const startDow = firstDay.getDay();
  const mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  let h = `<div class="ci-cal-nav">
    <button onclick="ciCalPrev()">‹</button>
    <span class="ci-cal-title">${ciCalYear}年 ${mNames[ciCalMonth]}</span>
    <button onclick="ciCalNext()">›</button>
  </div>
  <div class="ci-cal-grid">`;

  ['日','一','二','三','四','五','六'].forEach(d=>{ h+=`<div class="ci-dow">${d}</div>`; });
  for(let i=0;i<startDow;i++) h+=`<div class="ci-day om"></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const key=`${ciCalYear}-${String(ciCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const projs=dateMap[key]||[];
    const isToday=today.getFullYear()===ciCalYear&&today.getMonth()===ciCalMonth&&today.getDate()===d;
    const cls=['ci-day',projs.length?'hl':'',isToday?'td':''].filter(Boolean).join(' ');
    let tags='';
    projs.forEach(p=>{
      const {bg,fg}=projColor(p);
      tags+=`<div class="ci-tag" style="background:${bg};color:${fg};">${p}</div>`;
    });
    h+=`<div class="${cls}"><div class="ci-dn">${d}</div><div class="ci-dots">${tags}</div></div>`;
  }

  const trailing=(7-((startDow+daysInMonth)%7))%7;
  for(let i=0;i<trailing;i++) h+=`<div class="ci-day om"></div>`;
  h+=`</div>`;

  container.innerHTML=h;
}

function ciCalPrev(){
  ciCalMonth--; if(ciCalMonth<0){ciCalMonth=11;ciCalYear--;}
  renderCiCal();
}
function ciCalNext(){
  ciCalMonth++; if(ciCalMonth>11){ciCalMonth=0;ciCalYear++;}
  renderCiCal();
}

  saveLogs(logs);
  closeEditLog();
  renderTrainingEditList();
  renderHistory();
}
function deleteLog(id) {
  if(!confirm('确认删除这条训练记录？')) return;
  if(String(id).startsWith('p-')){ alert('预置历史记录不可删除'); return; }
  const logs = getLogs().filter(l=>!String(l.id).startsWith('p-') && String(l.id)!==String(id));
  saveLogs(logs);
  openLogItemId=null;
  renderTrainingEditList();
  renderHistory();
}

// ═══ RENDER EDIT LISTS ═══
const WDS2 = ['日','一','二','三','四','五','六'];
function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth()+1}月${d.getDate()}日 周${WDS2[d.getDay()]}`;
}

function renderCheckinEditList() {
  const c = document.getElementById('ci-edit-list');
  if(!c) return;
  const all = getCheckins(); // includes presets for display
  if(!all.length){ c.innerHTML='<div class="empty"><div class="ei">📭</div><div>暂无打卡记录</div></div>'; return; }
  const raw = new Set(getRawCheckins().map(x=>String(x.id)));
  let h='<div class="rec-list">';
  all.forEach(item=>{
    const isPreset = !raw.has(String(item.id));
    const dateStr = fmtDate(item.date);
    const amtStr = item.amount>0?item.amount+'元':'免费';
    const presetBadge = isPreset?'<span class="badge bp" style="font-size:10px;margin-left:4px;">历史</span>':'';
    h+=`<div class="rec-item">
      <div class="rec-item-hdr" onclick="toggleCiItem('${item.id}')">
        <div>
          <div class="rec-main">🏅 ${item.project}${presetBadge}</div>
          <div class="rec-sub">${dateStr}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="rec-amt">${amtStr}</span>
          <span class="rec-chevron" id="cichev-${item.id}">▾</span>
        </div>
      </div>
      <div class="rec-actions" id="cia-${item.id}">
        ${isPreset
          ? `<div style="font-size:12px;color:var(--t3);padding:4px 0;">预置历史记录不可修改</div>`
          : `<button class="btn-edit" onclick="openEditCi('${item.id}')">✏️ 编辑</button>
             <button class="btn-del"  onclick="deleteCi('${item.id}')">🗑️ 删除</button>`
        }
      </div>
    </div>`;
  });
  h+='</div>';
  c.innerHTML=h;
}

function renderTrainingEditList() {
  const c = document.getElementById('log-edit-list');
  if(!c) return;
  const all = getLogs();
  if(!all.length){ c.innerHTML='<div class="empty"><div class="ei">📭</div><div>暂无训练记录</div></div>'; return; }
  let h='<div class="rec-list">';
  all.forEach(item=>{
    const isPreset = String(item.id).startsWith('p-');
    const dateStr = fmtDate(item.date);
    const planIcon = {upper:'💪',lower:'🦵',core:'🦶'}[item.plan]||'🏋️';
    const presetBadge = isPreset?'<span class="badge bp" style="font-size:10px;margin-left:4px;">历史</span>':'';
    h+=`<div class="rec-item">
      <div class="rec-item-hdr" onclick="toggleLogItem('${item.id}')">
        <div>
          <div class="rec-main">${planIcon} ${item.planLabel||''}训练${presetBadge}</div>
          <div class="rec-sub">${dateStr} · ${item.results?item.results.length:0}个动作</div>
        </div>
        <span class="rec-chevron" id="logchev-${item.id}">▾</span>
      </div>
      <div class="rec-actions" id="loga-${item.id}">
        ${isPreset
          ? `<div style="font-size:12px;color:var(--t3);padding:4px 0;">预置历史记录不可修改</div>`
          : `<button class="btn-edit" onclick="openEditLog('${item.id}')">✏️ 编辑</button>
             <button class="btn-del"  onclick="deleteLog('${item.id}')">🗑️ 删除</button>`
        }
      </div>
    </div>`;
  });
  h+='</div>';
  c.innerHTML=h;
}

// ═══ INIT ═══
renderCheckin();
renderCiCal();
switchPlan('upper');
</script>
